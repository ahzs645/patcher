<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="676" height="844" viewBox="0 0 676 844" version="1.1" role="img" aria-labelledby="title description">
  <title id="title">British Columbia Forests — corrected oval reconstruction</title>
  <desc id="description">Reference-based SVG reconstruction checked against the supplied 676 × 945 PNG. Named layers, solid vector fills and Bézier paths; no embedded bitmap, linked asset or font dependency. This is not a verified official master.</desc>
  <metadata>Reconstruction from supplied PNG. Frame rebuilt as fitted ellipses. Eagle, separate foreground firs, distant treeline, elk, fish and glyphs refitted as vector Bézier paths. Raster is not embedded. Layer order preserves overlapping foreground trees over the distant woodland. Letterforms are outlines, not an identified font.</metadata>
  <defs>
    <clipPath id="landscape-clip" clipPathUnits="userSpaceOnUse">
      <ellipse id="landscape-clip-ellipse" cx="338.36631" cy="420.96480" rx="206.03861" ry="296.59750"/>
    </clipPath>
  </defs>
  <g id="oval-frame" inkscape:groupmode="layer" inkscape:label="Oval frame">
    <ellipse id="outer-black-oval" cx="338.33727" cy="420.96942" rx="326.92750" ry="414.76718" fill="#000000"/>
    <ellipse id="white-lettering-band" cx="338.32256" cy="420.96096" rx="310.34551" ry="398.06377" fill="#FFFFFF"/>
    <ellipse id="inner-black-oval" cx="338.35305" cy="420.94316" rx="222.52573" ry="313.12995" fill="#000000"/>
  </g>
  <g id="landscape" clip-path="url(#landscape-clip)" inkscape:groupmode="layer" inkscape:label="Landscape"><g data-shared="block-c169f73614"/></g>
  <g id="green-side-dots" fill="#15864A" inkscape:groupmode="layer" inkscape:label="Side dots">
    <circle id="left-dot" cx="76.45" cy="445.32" r="11.62"/>
    <circle id="right-dot" cx="600.53" cy="447.48" r="11.57"/>
  </g>
  <g id="upper-lettering" fill="#15864A" inkscape:groupmode="layer" inkscape:label="BRITISH COLUMBIA"><g data-shared="block-b03d9442f5"/></g>
  <g id="lower-lettering" fill="#15864A" inkscape:groupmode="layer" inkscape:label="FORESTS"><g data-shared="block-99305879b9"/></g>
  </svg>
