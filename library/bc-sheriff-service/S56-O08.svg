<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 28" role="img"><title>Deputy Sheriff — gold rocker</title><desc>The geometry is standardized to its shared construction master, removing photographic perspective/crop distortion. Readable source wording and colour edition are retained. Exact embroidered alphabet, thread colour and fine heraldic detail remain unverified. The paired collector-board titles show compact lettering set into the dark field with clearance at each end. Fine stitch and edge details are unresolved.</desc><metadata>{&quot;occurrenceId&quot;: &quot;S56-O08&quot;, &quot;svgPath&quot;: &quot;/workspace/forest-patch-review/clean-redraw/board-shared/S56-O08.svg&quot;, &quot;renderPath&quot;: &quot;/workspace/forest-patch-review/clean-redraw/board-shared/S56-O08.png&quot;, &quot;bbox&quot;: [47, 480, 122, 502], &quot;label&quot;: &quot;Deputy Sheriff \u2014 gold rocker&quot;, &quot;method&quot;: &quot;Canonical shared border and native framed provincial mark; uniformly scaled natural outlined glyphs with separate caption and crest clearances.&quot;, &quot;quality&quot;: &quot;Clean vector reconstruction&quot;, &quot;limits&quot;: &quot;The geometry is standardized to its shared construction master, removing photographic perspective/crop distortion. Readable source wording and colour edition are retained. Exact embroidered alphabet, thread colour and fine heraldic detail remain unverified.&quot;, &quot;templateId&quot;: &quot;bc-detached-rocker&quot;, &quot;sharedComponents&quot;: [&quot;canonical-rocker-border&quot;, &quot;canonical-caption-slots&quot;, &quot;bc-detached-rocker-single-v1&quot;], &quot;variantParameters&quot;: {&quot;captions&quot;: [&quot;DEPUTY SHERIFF&quot;], &quot;palette&quot;: {&quot;ground&quot;: &quot;#20252b&quot;, &quot;ink&quot;: &quot;#c3a64c&quot;}, &quot;extraHeader&quot;: null, &quot;captionLayout&quot;: &quot;One fixed glyph-ink centering rule against the inner curved border paint&quot;}, &quot;masterId&quot;: &q