  <title id="title">Predator Control / Division — constructed connected felt rocker</title>
  <desc id="desc">Constructed from the supplied photograph with a manually drawn Bezier-stroke alphabet. Independent cap heights, spacing and curved baselines preserve the two rows. No raster trace or installed typeface. Exact historical lettering and thread colours are unverified; the paired reference image is only 306 by 172 pixels.</desc>
