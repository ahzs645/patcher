<title id="title">British Columbia / Game / Warden — constructed felt patch</title>
<desc id="desc">Reference-based vector reconstruction of the supplied Game Warden photograph. Custom Bezier-stroke lettering: tall narrow upper capitals individually positioned on a high arch with modest lean, broader closely stacked GAME and WARDEN. A symmetric shallow-domed felt shape and separate gold inset regularize the fabric distortion. Exact historical alphabet, dimensions and thread colours are unverified; no photograph, traced contours or installed fonts are used.</desc>
