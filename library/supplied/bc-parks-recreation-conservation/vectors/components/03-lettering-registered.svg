  <title>Outlined badge lettering</title>
  <desc>Independent reconstruction from the supplied embroidered patch photograph. Smooth authored badge/frame and dogwood geometry; no bitmap tracing or raster embedding. Gold header is a visual substitute in Roboto Slab Bold, not an identified historical typeface. Body lettering uses a proportion-adjusted sans-serif substitute; PARKS is custom outlined lettering. Not an official original file or an embroidery-machine file.</desc>
