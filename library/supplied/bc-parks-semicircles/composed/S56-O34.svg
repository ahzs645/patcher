<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img"><title>B.C.G.S. / Camps — gold arch</title><desc>Constructed geometry, shared with the Parks Branch semicircles: a true semicircle, its field the exact inset by the border width, the upper wording on a concentric arc and the lower on straight baselines, each an even clearance inside the field. The atlas drew this arch flatter and freehand; its letter outlines and colours are kept, with caption spans and sizes checked against the photograph. The typeface and thread colours remain approximate.</desc><g transform="translate(240 240) scale(5)" data-construction="semicircle R=48"><path data-component="edge" d="M -48 0 A 48 48 0 0 1 48 0 Z" fill="#c19a4f"/><path data-component="field" d="M -44.8999 -3 A 45 45 0 0 1 44.8999 -3 Z" fill="#34252a"/><g data-caption="B.C.G.S."><path d="M79 0H408C477 0 528 19 567 61C603 99 623 151 623 208C623 296 583 349 490 385C557 416 591 469 591 544C591 598 571 644 533 678C494 713 445 729 375 729H79ZM172 415V647H352C404 647 433 640 458 621C484 601 498 571 498 531C498 491 484 461 458 441C433 422 404 415 352 415ZM172 82V333H399C481 333 530 286 530 207C530 129 481 82 399 82Z" fill="#c19a4f" transform="translate(-22.0479 -24.4866) rotate(-42) scale(0.01296296 -0.01296296) translate(-333.5 0)"/><path d="M191 104H87V0H191Z" fill="#c19a4f" transform="translate(-16.7405 -28.3806) rotate(-30.5345) scale(0.01296296 -0.01296296) translate(-139 0)"/><path d="M662 503C633 663 541 741 381 741C283 741 204 710 150 650C84 578 48 474 48 356C48 236 85 133 153 62C210 4 282 -23 377 -23C555 -23 655 73 677 266H581C573 216 563 182 548 153C518 93 456 59 378 59C233 59 141 175 141 357C141 544 228 659 370 659C429 659 484 642 514 613C541 588 556 558 567 503Z" fill="#c19a4f" transform="translate(-10.4275 -31.2565) rotate(-18.4492) scale(0.01296296 -0.01296296) translate(-361 0)"/><path d="M191 104H87V0H191Z" fill="#c19a4f" transform="translate(-3.6523 -32.747) rotate(-6.3639) scale(0.01296296 -0.0129