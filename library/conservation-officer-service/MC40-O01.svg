<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124" role="img"><title>Conservation Officer Service — chief gold shoulder edition</title><desc>Reconstruction with supplied native vector insignia. User-supplied native insignia paths and colours are retained. Shoulders use the crown/wreath/shield/dogwood portion with the lower ribbon and side folds excluded by a fixed vector window; cap/breast uses the complete native ribbon edition. Source photographs retain their own cloth cuts and captions. Exact embroidery edges, thread colours, original typeface and the uploaded artwork’s manufacturing provenance are not authenticated.</desc><metadata>{&quot;masterId&quot;: &quot;bc-co-service-2004-shoulder-v1&quot;, &quot;masterGeometryHash&quot;: &quot;c17ad06b77b27006ca2ae3e9be12d24d157d69a3b0afcfdc53d77e11a3a1201b&quot;, &quot;componentMasterIds&quot;: [&quot;uploaded-cos-crown-wreath-v1&quot;], &quot;sourceId&quot;: &quot;MC40&quot;, &quot;bbox&quot;: [6, 2, 280, 337], &quot;nativeSourceGeometryHash&quot;: &quot;1d1fd4c6e7308b7976391d470ad9a3b1915ef3469a5b6ac21b671f61c74a258e&quot;, &quot;nativeSelectionWindow&quot;: &quot;body&quot;}</metadata><path d="M6 21 Q8 15 18 10 Q50 -5 82 10 Q93 15 96 22 L79 111 Q77 120 70 120 H30 Q23 120 21 112Z" fill="#252333" stroke="#c8ab59" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><g data-component="co-service-wreath-emblem" transform="translate(17 7) scale(.7333333333)"><ns0:g xmlns:ns0="http://www.w3.org/2000/svg" data-component="supplied-cos-native-artwork" data-source-geometry-hash="1d1fd4c6e7308b7976391d470ad9a3b1915ef3469a5b6ac21b671f61c74a258e" data-window="body" transform="translate(-19.608674077 -5.59348947995) scale(0.893211591902)"><ns0:defs><ns0:clipPath id="e"><ns0:path d="M21.953 139.508h100.76V7.24H21.953Z"/></ns0:clipPath><ns0:clipPath id="cos-body-window" clipPathUnits="userSpaceOnUse"><ns0:path d="M21.953 7 H122.713 V80 C117 96 104 110 84 116 H62 C43 110 28 96 21.953 80 Z" fill-rule="evenodd"