<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 90" role="img"><title>Chief Conservation Officer / British Columbia — gold 1993-family edition</title><desc>Clean authored reconstruction: smooth explicit geometry, outlined captions, and named native armorial components. Fine embroidered lettering, exact thread colours and stitch structure are not retained. Outlined type is a source-similar substitute. Gold border and lettering are the chief palette variant of the existing shared 1993-family shoulder core. Fine stitch shape and exact gold thread colour are approximate.</desc><metadata>{&quot;masterId&quot;: &quot;conservation-concave-white&quot;, &quot;masterGeometryHash&quot;: &quot;938f3c64b908a03053c52d68e201a64afc17dc7af172df7670f353ee6e28255b&quot;, &quot;masterMetadata&quot;: [{&quot;id&quot;: &quot;conservation-concave-white&quot;, &quot;name&quot;: &quot;Conservation Concave White&quot;, &quot;geometryHash&quot;: &quot;938f3c64b908a03053c52d68e201a64afc17dc7af172df7670f353ee6e28255b&quot;, &quot;constantParts&quot;: [&quot;authored border profile&quot;, &quot;crest aspect and anchor&quot;, &quot;caption baseline slots and typography style&quot;], &quot;variantParts&quot;: [&quot;caption words&quot;, &quot;palette&quot;, &quot;native source-crop placement&quot;], &quot;designIds&quot;: [&quot;MC36-O01&quot;], &quot;evidence&quot;: &quot;The matching white-arms flared Sheriff/Deputy Sheriff pair and matching gold-arms rectangular Deputy Sheriff pair use identical authored geometry. Other border profiles, crest editions and caption layouts are separately named; colour/fine embroidery are interpretations.&quot;, &quot;captionLayout&quot;: [{&quot;capHeight&quot;: 4.3, &quot;font&quot;: &quot;condensed&quot;, &quot;baselineType&quot;: &quot;q&quot;, &quot;baseline&quot;: [5, 27, 45, 5, 84, 28]}, {&quot;capHeight&quot;: 4.7, &quot;font&quot;: &quot;condensed&quot;, &quot;baselineType&quot;: &quot;q&quot;, &quot;baseline&quot;: [13, 68, 45, 90, 78, 68]}], &qu