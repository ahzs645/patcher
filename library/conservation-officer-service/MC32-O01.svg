<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124" role="img"><title>Conservation Officer blazer emblem — earlier achievement</title><desc>Clean authored reconstruction: smooth explicit geometry, outlined captions, and named native armorial components. Fine embroidered lettering, exact thread colours and stitch structure are not retained. Outlined type is a source-similar substitute. The earlier achievement lacks the modern helmet and mantling. The selected historical Plateforge component is used in a gold ink interpretation; precise coloured thread panels and rope texture remain uncertain.</desc><metadata>{&quot;masterId&quot;: &quot;bc-co-blazer-historical-achievement-v1&quot;, &quot;masterGeometryHash&quot;: &quot;2cc1fc2aac4df5ea2f3bdca2dbf9c2e88a5c53fc370181604b7cc8dc0dfb21e3&quot;, &quot;masterMetadata&quot;: [{&quot;id&quot;: &quot;bc-co-blazer-historical-achievement-v1&quot;, &quot;name&quot;: &quot;Conservation Officer / British Columbia / Environment \u2014 earlier blazer emblem&quot;, &quot;svgPath&quot;: &quot;/workspace/forest-patch-review/clean-redraw/library/masters/bc-co-blazer-historical-achievement-v1.svg&quot;, &quot;geometryHash&quot;: &quot;2cc1fc2aac4df5ea2f3bdca2dbf9c2e88a5c53fc370181604b7cc8dc0dfb21e3&quot;, &quot;scope&quot;: &quot;Complete explicitly authored template&quot;, &quot;constantParts&quot;: [&quot;Border geometry&quot;, &quot;Emblem geometry and fixed placement&quot;, &quot;Outlined caption placement and wording&quot;], &quot;variantParts&quot;: [&quot;Palette&quot;, &quot;Uniform placement and scale&quot;], &quot;designIds&quot;: [&quot;MC32-O01&quot;], &quot;evidence&quot;: &quot;Every listed occurrence invokes this same authored template. Native modern achievement, historical achievement and compact motto/wreath constructs remain distinct.&quot;}, {&quot;id&quot;: &quot;plateforge-bc-arms-1917-type3&quot;, &quot;name&quot;: &quot;Plateforge BC arms \u2014 1917-late Type 3&quot;, &quot;svgPath&quot;: &quot;/workspace