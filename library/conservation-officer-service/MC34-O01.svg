<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 97" role="img"><title>Unapproved Conservation Officer prototype — attributed 1993</title><desc>Clean authored reconstruction: smooth explicit geometry, outlined captions, and named native armorial components. Fine embroidered lettering, exact thread colours and stitch structure are not retained. Outlined type is a source-similar substitute. Its wide, flat-bottom hourglass silhouette and two-line lower caption remain independent of the issued pointed shoulder and broad cap editions.</desc><metadata>{&quot;masterId&quot;: &quot;bc-co-unapproved-prototype-1993-v1&quot;, &quot;masterGeometryHash&quot;: &quot;d465ab22eb53f44523ff098f3514ff2bebdc02777e255799190e151ba1fd6cde&quot;, &quot;masterMetadata&quot;: [{&quot;id&quot;: &quot;bc-co-unapproved-prototype-1993-v1&quot;, &quot;name&quot;: &quot;Conservation Officer / British / Columbia \u2014 flat-bottom prototype&quot;, &quot;svgPath&quot;: &quot;/workspace/forest-patch-review/clean-redraw/library/masters/bc-co-unapproved-prototype-1993-v1.svg&quot;, &quot;geometryHash&quot;: &quot;d465ab22eb53f44523ff098f3514ff2bebdc02777e255799190e151ba1fd6cde&quot;, &quot;scope&quot;: &quot;Complete explicitly authored template&quot;, &quot;constantParts&quot;: [&quot;Border geometry&quot;, &quot;Emblem geometry and fixed placement&quot;, &quot;Outlined caption placement and wording&quot;], &quot;variantParts&quot;: [&quot;Palette&quot;, &quot;Uniform placement and scale&quot;], &quot;designIds&quot;: [&quot;MC34-O01&quot;], &quot;evidence&quot;: &quot;Every listed occurrence invokes this same authored template. Native modern achievement, historical achievement and compact motto/wreath constructs remain distinct.&quot;}, {&quot;id&quot;: &quot;uploaded-bc-modern-arms&quot;, &quot;name&quot;: &quot;User-supplied modern British Columbia coat of arms&quot;, &quot;svgPath&quot;: &quot;/workspace/forest-patch-review/clean-redraw/library/masters/uploaded-bc-modern-arms.svg&quot;, &q