<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 985 542" role="img"><title>British Columbia / Parks Branch — dogwood cap badge</title><desc>Clean designed reconstruction of the photographed badge. Smooth geometry and outlined type replace all image-derived contours. Relief, hammered grain, ageing, reflections and display stands are omitted. Exact original typeface, die engraving and material tones cannot be authenticated; the few silver/bronze fills are a material interpretation. The cap-badge scroll family is shared, with a separate dogwood, simplified framed arms or full-arms centre. Petal relief and small engraved lettering are idealized.</desc><metadata>{&quot;placementTransform&quot;: {&quot;type&quot;: &quot;uniform min-fit, centered&quot;, &quot;scale&quot;: 0.985, &quot;translate&quot;: [0.0, 5.050000000000011]}, &quot;componentMasterIds&quot;: [], &quot;componentGeometryHashes&quot;: {}, &quot;masterId&quot;: &quot;parks-cap-dogwood&quot;, &quot;masterGeometryHash&quot;: &quot;5f58d084cbfce0889bbe0b1837f48226af1445f0955c998c0e92c5d3347c7e44&quot;, &quot;baseGeometryHash&quot;: &quot;5f58d084cbfce0889bbe0b1837f48226af1445f0955c998c0e92c5d3347c7e44&quot;, &quot;masterSvgPath&quot;: &quot;/workspace/forest-patch-review/clean-redraw/badges/masters/parks-cap-dogwood.svg&quot;, &quot;occurrenceId&quot;: &quot;S15-O01&quot;, &quot;sourceId&quot;: &quot;S15&quot;, &quot;bbox&quot;: [53, 399, 1038, 941], &quot;label&quot;: &quot;British Columbia / Parks Branch \u2014 dogwood cap badge&quot;, &quot;family&quot;: &quot;parks-cap-dogwood&quot;, &quot;medium&quot;: &quot;Metal badge&quot;, &quot;svgPath&quot;: &quot;/workspace/forest-patch-review/clean-redraw/badges/S15-O01.svg&quot;, &quot;renderPath&quot;: &quot;/workspace/forest-patch-review/clean-redraw/badges/S15-O01.png&quot;, &quot;filename&quot;: &quot;S15-O01.svg&quot;, &quot;method&quot;: &quot;Clean vector drawing from explicit badge-family geometry, individually positioned outlined lettering and reusabl